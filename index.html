async function renderSaisie(s) {
  if (!PEUT_SAISIR(s.role)) { go("/"); return route(); }
  shell(s, "saisie", "Saisie", '<div class="card"><div class="muted">Chargement…</div></div>');
  const tree = await DB.metiersTree(s.chantier.id);
  const geoTree = await DB.geoTree(s.chantier.id);
  SAISIE_REPERES_INDEX = await DB.ouvrageIndex(s.chantier.id);

  $(".content").innerHTML = `
    <h2>Nouvelle déclaration</h2>
    ${!tree.length ? `<div class="al warn">Aucune configuration métiers importée — allez d'abord dans <a href="#/referentiels/ouvrages">Référentiels → Ouvrages</a>.</div>` : `
    <div class="card">
      <div class="row" style="gap:16px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="margin:0"><label>Date</label><input class="inp" id="sa-date" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="field" style="margin:0"><label>Équipe</label><input class="inp" id="sa-equipe" placeholder="Noms de l'équipe" style="min-width:220px"></div>
        <div class="field" style="margin:0"><label>Corps de métier</label><select class="inp" id="sa-metier"><option value="">— choisir —</option>${tree.map((cm) => `<option value="${esc(cm.code)}">${esc(cm.code)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0"><label>Bâtiment</label><select class="inp" id="sa-batiment" style="min-width:100px"><option value="">— choisir —</option>${trierBatiments(geoTree.map((b) => b.code)).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0"><label>Niveau</label><select class="inp" id="sa-niveau" style="min-width:100px" disabled><option value="">—</option></select></div>
        <div class="field" style="margin:0"><label>Local</label><select class="inp" id="sa-local" style="min-width:140px" disabled><option value="">—</option></select></div>
      </div>

      <div id="sa-grid-wrap" style="margin-top:16px;display:none">
        <table class="grid">
          <thead><tr><th>Type d'ouvrage</th><th>Repère fonctionnel</th><th>Activité</th><th>Valeur</th><th>Commentaire</th><th>Points bloquants</th><th>Soldé</th><th></th></tr></thead>
          <tbody id="sa-tbody"></tbody>
        </table>
        <button class="btn secondary small" id="sa-add" style="margin-top:8px" type="button">+ Ajouter une ligne</button>
        <div class="hint">Astuce : Entrée dans « Points bloquants » ajoute une nouvelle ligne sans lâcher le clavier.</div>
      </div>
      <div id="sa-errs"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="sa-save">Enregistrer la déclaration</button>
      </div>
    </div>
    `}

    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:10px">Déclarations récentes</h3>
      <div id="sa-recent"><div class="hint">Chargement…</div></div>
    </div>
  `;

  if (tree.length) {
    const refreshAllRepereOptions = () => document.querySelectorAll("#sa-tbody tr[data-row]").forEach(refreshRowRepereOptions);
    $("#sa-metier").onchange = () => {
      const cm = tree.find((c) => c.code === $("#sa-metier").value);
      SAISIE_TYPES = cm ? cm.types : [];
      $("#sa-tbody").innerHTML = "";
      $("#sa-grid-wrap").style.display = SAISIE_TYPES.length ? "" : "none";
      if (SAISIE_TYPES.length) addSaisieRow();
    };
    $("#sa-batiment").onchange = () => {
      const b = geoTree.find((x) => x.code === $("#sa-batiment").value);
      const nivSel = $("#sa-niveau"), locSel = $("#sa-local");
      nivSel.innerHTML = `<option value="">— choisir —</option>` + (b ? trierNiveaux(b.niveaux.map((n) => n.code)).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("") : "");
      nivSel.disabled = !b;
      locSel.innerHTML = `<option value="">—</option>`;
      locSel.disabled = true;
      refreshAllRepereOptions();
    };
    $("#sa-niveau").onchange = () => {
      const b = geoTree.find((x) => x.code === $("#sa-batiment").value);
      const n = b && b.niveaux.find((x) => x.code === $("#sa-niveau").value);
      const locSel = $("#sa-local");
      const locauxIci = n ? n.zones.flatMap((z) => z.locaux) : [];
      locSel.innerHTML = `<option value="">— choisir —</option>` + locauxIci.map((l) => `<option value="${esc(l.code)}">${esc(l.code)}</option>`).join("");

async function saveSaisie(s) {
  const date = $("#sa-date").value;
  const equipe = $("#sa-equipe").value.trim();
  const corpsMetierCode = $("#sa-metier").value;
  const localCode = $("#sa-local").value.trim();
  const rows = readSaisieRows();

  const errs = $("#sa-errs");
  errs.innerHTML = "";
  const globalMsgs = [];
  if (!date) globalMsgs.push("La date est obligatoire.");
  if (!corpsMetierCode) globalMsgs.push("Le corps de métier est obligatoire.");
  if (!localCode) globalMsgs.push("Le local est obligatoire.");
  if (!rows.length) globalMsgs.push("Ajoutez au moins une ligne.");

  const rowErrors = validateSaisieRows(rows);

  document.querySelectorAll("#sa-tbody tr").forEach((tr) => (tr.style.background = ""));
  if (globalMsgs.length || rowErrors.length) {
    errs.innerHTML = `
      ${globalMsgs.length ? `<div class="formerr" style="margin-top:12px">${globalMsgs.map(esc).join("<br>")}</div>` : ""}
      ${rowErrors.length ? `<div class="formerr" style="margin-top:12px">${rowErrors.map((e) => `Ligne ${e.index} : ${e.msgs.map(esc).join(" ; ")}`).join("<br>")}</div>` : ""}
    `;
    rowErrors.forEach((e) => { const tr = document.querySelector(`#sa-tbody tr[data-row="${e.key}"]`); if (tr) tr.style.background = "var(--red-bg)"; });
    return;
  }

  const btn = $("#sa-save"); btn.disabled = true; btn.textContent = "Enregistrement…";
  const res = await DB.declarationCreate(s.chantier.id, { date, equipe, localCode, corpsMetierCode, lignes: rows }, s.user.id);
  btn.disabled = false; btn.textContent = "Enregistrer la déclaration";
  if (res.error) return toast(res.error, "err");

  toast(`Déclaration enregistrée — ${rows.length} ligne${rows.length > 1 ? "s" : ""}.`);
  renderSaisie(Session.get());
}

              ? `<input class="inp lg-quantite" type="number" step="any" style="width:90px" value="${l.quantite != null ? l.quantite : ""}"> <span class="muted" style="font-size:11px">${esc(l.unite || "")}</span>`
              : (l.operations || []).map((o) => `<label style="display:block;font-size:12px;font-weight:400"><input type="checkbox" class="lg-op" value="${esc(o.code)}"${(l.operationsFaites || []).includes(o.code) ? " checked" : ""}> ${esc(o.libelle)}</label>`).join("")}</td>
            <td><input class="inp lg-commentaire" value="${esc(l.commentaire || "")}"></td>
            <td><input class="inp lg-bloquants" value="${esc(l.pointsBloquants || "")}"></td>
            <td style="text-align:center"><input type="checkbox" class="lg-solde"${l.solde ? " checked" : ""}></td>
            <td><button class="btn ghost small lg-hist" type="button">Voir</button><div class="lg-hist-box"></div></td>
          </tr>`).join("")}</tbody>
      </table>
      <button class="btn primary small" id="sa-save-corr" style="margin-top:10px" type="button">Enregistrer les corrections</button>
    </div>
  `;
  $("#sa-close").onclick = () => { box.innerHTML = ""; };
  box.querySelectorAll(".lg-hist").forEach((btn) => (btn.onclick = async () => {
    const tr = btn.closest("tr");
    const hb = tr.querySelector(".lg-hist-box");
    const j = await DB.journalFor(s.chantier.id, "ligne_declaration", tr.dataset.ligne);
    hb.innerHTML = j.length
      ? `<div style="margin-top:6px;font-size:11px" class="hint">${j.map((x) => `${esc(x.champ)} : « ${esc(String(x.avant))} » → « ${esc(String(x.apres))} » — ${esc(x.auteurNom)}, ${esc((x.faitLe || "").slice(0, 16).replace("T", " "))}`).join("<br>")}</div>`
      : `<div class="hint" style="margin-top:6px">Aucune correction.</div>`;
  }));
  $("#sa-save-corr").onclick = async () => {
    const btn = $("#sa-save-corr"); btn.disabled = true; btn.textContent = "Enregistrement…";
    for (const l of d.lignes) {
      const tr = box.querySelector(`tr[data-ligne="${l.id}"]`);
      const patch = {
        commentaire: tr.querySelector(".lg-commentaire").value.trim(),
        pointsBloquants: tr.querySelector(".lg-bloquants").value.trim(),
        solde: tr.querySelector(".lg-solde").checked,
      };
      if (l.nature === "quantite") {
        const v = tr.querySelector(".lg-quantite").value;
        patch.quantite = v !== "" ? Number(v) : null;
      } else {
        patch.operationsFaites = [...tr.querySelectorAll(".lg-op:checked")].map((c) => c.value);
      }
      await DB.ligneUpdate(s.chantier.id, l.id, patch, s.user.id);
    }
    toast("Corrections enregistrées.");
    paintDeclarationDetail(s, declarationId);
  };
}

/* ===== PHASE 5 — consultation de l'avancement ===== */

function avancementPct(r) {
  if (r.soldeAtteint) return 100;
  if (r.nature === "quantite") return r.quantitePrevue > 0 ? Math.round((r.quantitePosee / r.quantitePrevue) * 100) : null;
  return r.operationsTotal > 0 ? Math.round((r.operationsFaitesUnion.length / r.operationsTotal) * 100) : null;
}
function avancementStatut(r) {
  if (r.statut === "a_rattacher") return "a_rattacher";
  if (r.nbDeclarations === 0) return "non_commence";
  const pct = avancementPct(r);
  if (r.soldeAtteint || (pct != null && pct >= 100)) return "solde";
  return "en_cours";
}
function poseDisplay(r) {
  if (r.nature === "quantite") return `${r.quantitePosee != null ? r.quantitePosee : 0} ${r.unite || ""}`.trim();
  const fait = r.soldeAtteint ? r.operationsTotal : r.operationsFaitesUnion.length;
  return `${fait}/${r.operationsTotal} opération${r.operationsTotal > 1 ? "s" : ""}`;
}
function restantDisplay(r) {
  if (r.nature === "quantite") return r.quantitePrevue != null ? `${Math.max(r.quantitePrevue - (r.quantitePosee || 0), 0)} ${r.unite || ""}`.trim() : "—";
  if (!r.operationsTotal) return "—";
  const fait = r.soldeAtteint ? r.operationsTotal : r.operationsFaitesUnion.length;
  const restant = Math.max(r.operationsTotal - fait, 0);
  return `${restant} opération${restant > 1 ? "s" : ""}`;
}

/* ---------------------------------------------------------------------
   Écran — Avancement (consultation)
   --------------------------------------------------------------------- */
async function renderAvancement(s) {
  shell(s, "avancement", "Avancement", '<div class="card"><div class="muted">Chargement…</div></div>');
  const geoTree = await DB.geoTree(s.chantier.id);
  const metiersTree = await DB.metiersTree(s.chantier.id);
  const batiments = trierBatiments(geoTree.map((b) => b.code));

  $(".content").innerHTML = `
    <h2>Avancement</h2>
    <div class="card">
      <div class="row" style="gap:16px;flex-wrap:wrap;align-items:flex-start">
        <div class="field" style="margin:0"><label>Bâtiment</label><select class="inp" id="av-batiment" multiple size="4" style="min-width:100px">${batiments.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0"><label>Niveau</label><select class="inp" id="av-niveau" style="min-width:100px"><option value="">Tous</option></select></div>
        <div class="field" style="margin:0"><label>Corps de métier</label><select class="inp" id="av-metier" multiple size="4" style="min-width:170px">${metiersTree.map((cm) => `<option value="${esc(cm.code)}">${esc(cm.code)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0"><label>Type d'ouvrage</label><select class="inp" id="av-type" multiple size="4" style="min-width:170px"></select></div>
        <div class="field" style="margin:0"><label>Recherche</label><input class="inp" id="av-texte" placeholder="repère, local, type…" style="min-width:170px"></div>
        <div class="field" style="margin:0"><label>Du</label><input class="inp" id="av-date-debut" type="date" style="width:150px"></div>
        <div class="field" style="margin:0"><label>Au</label><input class="inp" id="av-date-fin" type="date" style="width:150px"></div>
        <div class="field" style="margin:0"><label>&nbsp;</label><button class="btn secondary" id="av-reset" type="button">Réinitialiser</button></div>
      </div>
      <div class="hint">Bâtiment et corps de métier : sélection multiple (Cmd/Ctrl-clic). Les filtres se combinent ; « Du/Au » filtre les déclarations prises en compte dans le posé.</div>
    </div>

    <div class="kpis" id="av-kpis" style="margin-top:16px"></div>
    <div class="card" style="margin-top:16px">
      <div id="av-table"><div class="hint">Chargement…</div></div>
      <div id="av-detail" style="margin-top:14px"></div>
    </div>
  `;

  function currentFilters() {
    return {
      batiments: [...document.querySelectorAll("#av-batiment option:checked")].map((o) => o.value),
      corpsMetiers: [...document.querySelectorAll("#av-metier option:checked")].map((o) => o.value),
      typeOuvrages: [...document.querySelectorAll("#av-type option:checked")].map((o) => o.value),
      niveau: $("#av-niveau").value || null,
      texte: $("#av-texte").value.trim(),
      dateDebut: $("#av-date-debut").value || null,
      dateFin: $("#av-date-fin").value || null,
    };
  }

  function refreshNiveauOptions() {
    const chosen = [...document.querySelectorAll("#av-batiment option:checked")].map((o) => o.value);
    const niv = $("#av-niveau");
    const prev = niv.value;
    const set = new Set();
    geoTree.forEach((b) => { if (!chosen.length || chosen.includes(b.code)) b.niveaux.forEach((n) => set.add(n.code)); });
    niv.innerHTML = `<option value="">Tous</option>` + trierNiveaux([...set]).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    if (set.has(prev)) niv.value = prev;
  }
  function refreshTypeOptions() {
    const chosen = [...document.querySelectorAll("#av-metier option:checked")].map((o) => o.value);
    const typeSel = $("#av-type");
    const opts = [];
    metiersTree.forEach((cm) => { if (!chosen.length || chosen.includes(cm.code)) cm.types.forEach((t) => opts.push({ v: t.code, label: cm.code + " / " + t.libelle })); });
    typeSel.innerHTML = opts.map((o) => `<option value="${esc(o.v)}">${esc(o.label)}</option>`).join("");
  }
  refreshNiveauOptions();
  refreshTypeOptions();

  const refresh = () => refreshAvancementTable(s, currentFilters());
  $("#av-batiment").onchange = () => { refreshNiveauOptions(); refresh(); };
  $("#av-niveau").onchange = refresh;
  $("#av-metier").onchange = () => { refreshTypeOptions(); refresh(); };
  $("#av-type").onchange = refresh;
  $("#av-texte").oninput = refresh;
  $("#av-date-debut").onchange = refresh;
  $("#av-date-fin").onchange = refresh;
  $("#av-reset").onclick = () => {
    document.querySelectorAll("#av-batiment option, #av-metier option, #av-type option").forEach((o) => (o.selected = false));
    $("#av-niveau").value = ""; $("#av-texte").value = ""; $("#av-date-debut").value = ""; $("#av-date-fin").value = "";
    refreshNiveauOptions(); refreshTypeOptions(); refresh();
  };

  refresh();
}

async function refreshAvancementTable(s, filters) {
  const box = $("#av-table");
  box.innerHTML = `<div class="hint">Chargement…</div>`;
  const rows = await DB.avancementList(s.chantier.id, filters);

  const c = { solde: 0, en_cours: 0, non_commence: 0, a_rattacher: 0 };
  rows.forEach((r) => c[avancementStatut(r)]++);
  $("#av-kpis").innerHTML = `
    <div class="kpi"><div class="k">Ouvrages</div><div class="v">${rows.length}</div></div>
    <div class="kpi"><div class="k">Soldés</div><div class="v">${c.solde}</div></div>
    <div class="kpi"><div class="k">En cours</div><div class="v">${c.en_cours}</div></div>
    <div class="kpi"><div class="k">Non commencés</div><div class="v">${c.non_commence}</div></div>
    ${c.a_rattacher ? `<div class="kpi flag"><div class="k">À rattacher</div><div class="v">${c.a_rattacher}</div></div>` : ""}
  `;

  if (!rows.length) {
    box.innerHTML = `<div class="hint" style="padding:16px 0">Aucun ouvrage pour ce filtre.</div>`;
    $("#av-detail").innerHTML = "";
    return;
  }

  box.innerHTML = `
    <table class="grid">
      <thead><tr><th>Repère</th><th>Local</th><th>Type d'ouvrage</th><th>Corps de métier</th><th>Prévu</th><th>Posé</th><th>Restant</th><th>Avancement</th><th>Statut</th><th></th></tr></thead>
      <tbody>${rows.map((r) => {
        const pct = avancementPct(r);
        const statut = avancementStatut(r);
        const bdg = { solde: '<span class="bdg ok">Soldé</span>', en_cours: '<span class="bdg run">En cours</span>', non_commence: '<span class="bdg none">Non commencé</span>', a_rattacher: '<span class="bdg flag">À rattacher</span>' }[statut];
        return `<tr>
          <td class="rf">${esc(r.repere)}</td>
          <td class="mono">${esc(r.local)}</td>
          <td>${esc(r.typeLibelle || "")}</td>
          <td>${esc(r.corpsMetier || "")}</td>
          <td>${r.quantitePrevue != null ? r.quantitePrevue + " " + esc(r.unite || "") : "—"}</td>
          <td>${esc(poseDisplay(r))}</td>
          <td>${esc(restantDisplay(r))}</td>
          <td>${pct != null ? `<span class="bar"><i style="width:${Math.min(pct, 100)}%"></i></span>${pct}%` : "—"}</td>
          <td>${bdg}</td>
          <td><button class="btn ghost small av-detail-btn" data-id="${r.ouvrageId}" type="button">Détail</button></td>
        </tr>`;
      }).join("")}</tbody>
    </table>
  `;
  box.querySelectorAll(".av-detail-btn").forEach((btn) => (btn.onclick = () => paintAvancementDetail(s, btn.dataset.id, rows.find((r) => r.ouvrageId === btn.dataset.id))));
}

async function paintAvancementDetail(s, ouvrageId, row) {
  const box = $("#av-detail");
  box.innerHTML = `<div class="hint">Chargement…</div>`;
  const lignes = await DB.lignesPourOuvrage(s.chantier.id, ouvrageId);
  box.innerHTML = `
    <div class="card">
      <div class="spread"><h3 style="margin:0">Déclarations sources — ${esc(row.repere)}</h3><button class="btn ghost small" id="av-detail-close" type="button">Fermer</button></div>
      ${lignes.length ? `
      <table class="grid" style="margin-top:8px">
        <thead><tr><th>Date</th><th>Activité</th><th>Valeur</th><th>Commentaire</th><th>Points bloquants</th><th>Soldé</th><th>Saisi par</th></tr></thead>
        <tbody>${lignes.map((l) => `
          <tr>
            <td class="mono">${esc(l.date)}</td>
            <td>${esc(l.activiteLibelle || "—")}</td>
            <td>${l.quantite != null ? l.quantite + " " + esc(row.unite || "") : ((l.operationsFaites || []).join(", ") || "—")}</td>
            <td>${esc(l.commentaire || "—")}</td>
            <td>${esc(l.pointsBloquants || "—")}</td>
            <td>${l.solde ? '<span class="bdg ok">Oui</span>' : '<span class="bdg none">Non</span>'}</td>
            <td>${esc(l.auteurNom)}</td>
          </tr>`).join("")}</tbody>
      </table>` : `<div class="hint" style="margin-top:8px">Aucune déclaration pour cet ouvrage.</div>`}
    </div>
  `;
  $("#av-detail-close").onclick = () => { box.innerHTML = ""; };
}
