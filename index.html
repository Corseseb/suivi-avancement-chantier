<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Design system — Maquette B (continuité pointage). Voir docs/DESIGN.md
   ===================================================================== */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --panel-2:#f6f8f7;
  --ink:#17242b; --muted:#5f6b64;
  --line:#dbdfdc; --line-strong:#b7bdb8;
  --accent:#2f7d64; --accent-hover:#26654f; --accent-ink:#ffffff;
  --accent-2:#16324f;
  --green:#1f9d55; --green-bg:#e6f5ec; --green-ink:#0f6a37;
  --amber:#d97706; --amber-bg:#fdf0e0; --amber-ink:#8a5200;
  --red:#dc2626; --red-bg:#fbe9e9; --red-ink:#a71d1d;
  --edit:#fffdf3;
  --r-sm:6px; --r-md:9px; --r-lg:12px;
  --shadow:0 6px 24px rgba(20,32,26,.08);
  --font-head:"Archivo", system-ui, sans-serif;
  --font-ui:"Inter", system-ui, -apple-system, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-head);margin:0 0 .4em;font-weight:700;letter-spacing:-.005em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
#root{min-height:100%}
.app{display:grid;grid-template-columns:172px 1fr;min-height:100vh}
.side{background:var(--accent-2);color:#dfe8f0;display:flex;flex-direction:column;padding:16px 0}
.side .brand{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:0 18px 16px}
.side nav a{display:block;padding:9px 18px;font-size:13px;color:#cfe0ec}
.side nav a.on{background:var(--accent);color:#fff;font-weight:600}
.side nav a:hover:not(.on){background:rgba(255,255,255,.06)}
.side .side-foot{margin-top:auto;padding:12px 18px;font-size:11px;color:#8fa6b6}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .h{font-family:var(--font-head);font-weight:700;font-size:17px}
.topbar .chantier{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px;margin-left:8px}
.topbar .right{display:flex;align-items:center;gap:14px}
.topbar .ver{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.topbar .who{font-size:13px}
.topbar .who b{font-weight:600}
.content{padding:22px 20px;max-width:1360px;width:100%}

/* ---------- centered (login / chantier choice) ---------- */
.centered{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);width:100%;max-width:400px;padding:32px}
.auth .kick{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.auth h1{font-size:22px;margin:.2em 0 .1em}
.auth .sub{color:var(--muted);font-size:13px;margin-bottom:20px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;font-family:var(--font-ui);font-size:14px;padding:9px 11px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink)}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.inp.err{border-color:var(--red);background:var(--red-bg)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.formerr{font-size:12.5px;color:var(--red-ink);background:var(--red-bg);border-left:3px solid var(--red);border-radius:var(--r-sm);padding:8px 11px;margin-bottom:14px}

/* ---------- buttons ---------- */
.btn{font-weight:600;padding:9px 16px;border-radius:var(--r-md);border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.secondary{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--panel-2)}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent;padding:9px 8px}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- cards / chantier picker ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.pick{display:grid;gap:10px;margin-top:4px}
.pick button{display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:14px 16px;width:100%}
.pick button:hover{border-color:var(--accent);background:var(--panel-2)}
.pick .code{font-family:var(--font-mono);font-size:13px;font-weight:500}
.pick .lib{font-size:13px;color:var(--muted)}
.pick .role{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}

/* ---------- table ---------- */
table.grid{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-size:13px}
table.grid thead th{background:var(--panel-2);font-family:var(--font-head);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-strong)}
table.grid td{padding:9px 12px;border-bottom:1px solid var(--line)}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr:hover{background:var(--panel-2)}

/* ---------- badges ---------- */
.bdg{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.bdg.role{background:var(--panel-2);color:var(--accent-2);border:1px solid var(--line-strong)}
.bdg.on{background:var(--green-bg);color:var(--green-ink)}
.bdg.off{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-strong)}

/* ---------- kpis / progress bar (Avancement) ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.kpi .k{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-head);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi.flag{border-color:var(--amber);background:var(--amber-bg)}
.kpi.flag .v,.kpi.flag .k{color:var(--amber-ink)}
.bar{position:relative;height:6px;width:60px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
td.rf{font-family:var(--font-mono);font-size:12px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent-2);color:#fff;
  padding:11px 18px;border-radius:var(--r-md);font-size:13.5px;box-shadow:var(--shadow);z-index:50;max-width:90vw}
.toast.err{background:var(--red)}

/* ---------- misc ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;margin-right:6px}
table.grid label:has(input[type="checkbox"]){display:flex!important;align-items:center;gap:0;padding:3px 0;cursor:pointer}
.demo-banner{background:var(--amber-bg);color:var(--amber-ink);font-size:12px;text-align:center;padding:6px 12px;border-bottom:1px solid var(--amber)}

@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;padding:8px}
  .side .brand{padding:6px 10px}
  .side .side-foot{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
/* =====================================================================
   Suivi d'avancement chantier — lot D08 (RJH / Axima)
   Phase 1 : socle — connexion, choix du chantier, accueil, comptes.
   Voir docs/PLAN.md (Phase 1), docs/business_rules.md (RG-1 → RG-8).
   ===================================================================== */

const APP_VERSION = "0.7.0";

/* ---------------------------------------------------------------------
   Configuration du déploiement (principe PRD n°12 — neutralité).
   Le code métier ne connaît jamais l'emplacement de la base : il parle
   à l'objet DB ci-dessous. Trois modes possibles derrière la même
   interface : "demo" (mémoire), "cloud" (Supabase hébergé), "local"
   (Supabase auto-hébergé sur le réseau Axima). Voir docs/architecture.md
   --------------------------------------------------------------------- */
const CONFIG = {
  mode: "cloud",
  supabaseUrl: "https://pbzyfwvaxtuviygcicxp.supabase.co",
  supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBienlmd3ZheHR1dml5Z2NpY3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjQ0NDgsImV4cCI6MjEwNDEwMDQ0OH0.rFWzntvNpVOhQ4ekrIfs21y82CTUpvMn2vFl54U9U2g",
};

/* =====================================================================
   Couche d'accès aux données — implémentation "demo"
   Jeu de données bouché pour développer, tester à blanc et démontrer
   la Phase 1 sans dépendre d'un projet Supabase.
   ===================================================================== */
const DEMO = {
  chantiers: [
    { id: "c-rjh-d08", code: "RJH-D08", libelle: "RJH — lot D08 ventilation nucléaire", actif: true },
  ],
  users: [
    { id: "u-corsiez",  email: "s.corsiez@axima.fr",   nom_affiche: "S. Corsiez",   actif: true },
    { id: "u-data",     email: "data.d08@axima.fr",    nom_affiche: "C. Bertin",    actif: true },
    { id: "u-assist",   email: "assistante.d08@axima.fr", nom_affiche: "L. Assistante", actif: true },
    { id: "u-conduc",   email: "conducteur.d08@axima.fr", nom_affiche: "J. Conducteur", actif: true },
    { id: "u-planif",   email: "planning.d08@axima.fr", nom_affiche: "M. Planificateur", actif: true },
    { id: "u-dir",      email: "direction.d08@axima.fr", nom_affiche: "Direction projet", actif: false },
  ],
  memberships: [
    { chantier_id: "c-rjh-d08", user_id: "u-corsiez", role: "admin" },
    { chantier_id: "c-rjh-d08", user_id: "u-data",    role: "ingenieur_data" },
    { chantier_id: "c-rjh-d08", user_id: "u-assist",  role: "saisisseur" },
    { chantier_id: "c-rjh-d08", user_id: "u-conduc",  role: "saisisseur" },
    { chantier_id: "c-rjh-d08", user_id: "u-planif",  role: "consultant" },
    { chantier_id: "c-rjh-d08", user_id: "u-dir",     role: "consultant" },
  ],
  password: "demo", // mot de passe unique en mode démo
  // Référentiel géographique — vide au départ, alimenté par import (Phase 2)
  geo: { batiments: [], niveaux: [], zones: [], locaux: [] },
  // Référentiel métiers / ouvrages — vide au départ, alimenté par import (Phase 3)
  metiers: { corpsMetier: [], typeOuvrage: [], activite: [], operation: [] },
  ouvrages: [],
  // Production — vide au départ, alimenté par la saisie (Phase 4)
  declarations: [],
  lignes: [],
  journal: [],
};

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const DB_DEMO = {
  async login(email, password) {
    await wait(150);
    const u = DEMO.users.find((x) => x.email.toLowerCase() === email.trim().toLowerCase());
    if (!u || password !== DEMO.password) return { error: "Identifiant ou mot de passe incorrect." };
    if (!u.actif) return { error: "Ce compte est désactivé. Contactez l'ingénieur DATA." }; // RG-2
    return { user: { ...u } };
  },
  async chantiersOf(userId) {
    await wait(80);
    const ids = DEMO.memberships.filter((m) => m.user_id === userId).map((m) => m.chantier_id);
    return DEMO.chantiers
      .filter((c) => c.actif && ids.includes(c.id))
      .map((c) => ({ ...c, role: DEMO.memberships.find((m) => m.chantier_id === c.id && m.user_id === userId).role }));
  },
  async roleOf(chantierId, userId) {
    const m = DEMO.memberships.find((x) => x.chantier_id === chantierId && x.user_id === userId);
    return m ? m.role : null;
  },
  async members(chantierId) {
    await wait(80);
    return DEMO.memberships
      .filter((m) => m.chantier_id === chantierId)
      .map((m) => ({ ...DEMO.users.find((u) => u.id === m.user_id), role: m.role }));
  },
  async createMember(chantierId, { email, nom_affiche, role }) {
    await wait(120);
    if (DEMO.users.some((u) => u.email.toLowerCase() === email.toLowerCase()))
      return { error: "Un compte existe déjà avec cet e-mail." };
    const u = { id: "u-" + Math.random().toString(36).slice(2, 8), email, nom_affiche, actif: true };
    DEMO.users.push(u);
    DEMO.memberships.push({ chantier_id: chantierId, user_id: u.id, role });
    return { ok: true };
  },
  async setActive(userId, actif) { await wait(60); DEMO.users.find((u) => u.id === userId).actif = actif; return { ok: true }; },
  async setRole(chantierId, userId, role) {
    await wait(60);
    DEMO.memberships.find((m) => m.chantier_id === chantierId && m.user_id === userId).role = role;
    return { ok: true };
  },

  /* ----- Phase 2 : référentiel géographique -----
     (chantierId ignoré en mode démo : un seul chantier géré, mais le
     paramètre existe pour garder la même signature que le mode cloud) */
  async geoSummary(_chantierId) {
    await wait(60);
    const g = DEMO.geo;
    return { batiments: g.batiments.length, niveaux: g.niveaux.length, zones: g.zones.length, locaux: g.locaux.length };
  },
  async geoTree(_chantierId) {
    await wait(60);
    const g = DEMO.geo;
    return g.batiments.map((b) => ({
      ...b,
      niveaux: g.niveaux.filter((n) => n.batiment === b.code).map((n) => ({
        ...n,
        zones: g.zones.filter((z) => z.niveau === n.code).map((z) => ({
          ...z,
          locaux: g.locaux.filter((l) => l.zone_cea === z.code_seva && l.niveau === n.code),
        })),
      })),
    }));
  },
  async geoFindLocal(_chantierId, term) {
    await wait(40);
    const t = term.trim().toLowerCase();
    if (!t) return [];
    return DEMO.geo.locaux.filter((l) =>
      l.code.toLowerCase().includes(t) || (l.zone_int || "").toLowerCase().includes(t) || l.zone_cea.toLowerCase().includes(t)
    ).slice(0, 40);
  },
  async geoImportCommit(_chantierId, kept, _auteurId) {
    await wait(200);
    const g = { batiments: [], niveaux: [], zones: [], locaux: [] };
    const seenB = new Set(), seenN = new Set(), seenZ = new Set(), seenL = new Set();
    for (const r of kept) {
      if (!seenB.has(r.batiment)) { seenB.add(r.batiment); g.batiments.push({ code: r.batiment }); }
      const nk = r.batiment + "|" + r.niveau;
      if (!seenN.has(nk)) { seenN.add(nk); g.niveaux.push({ code: r.niveau, batiment: r.batiment }); }
      const zk = r.niveau + "|" + r.zoneCea;
      if (!seenZ.has(zk)) { seenZ.add(zk); g.zones.push({ code_seva: r.zoneCea, code_int: r.zoneInt || null, niveau: r.niveau }); }
      if (!seenL.has(r.local)) { seenL.add(r.local); g.locaux.push({ code: r.local, zone_cea: r.zoneCea, zone_int: r.zoneInt || null, niveau: r.niveau, batiment: r.batiment }); }
    }
    DEMO.geo = g;
    return { ok: true, stats: { batiments: g.batiments.length, niveaux: g.niveaux.length, zones: g.zones.length, locaux: g.locaux.length } };
  },

  /* ----- Phase 3 : référentiel ouvrages, métiers, activités ----- */
  async metiersSummary(_chantierId) {
    await wait(50);
    const m = DEMO.metiers;
    return { corpsMetier: m.corpsMetier.length, typeOuvrage: m.typeOuvrage.length, activites: m.activite.length, operations: m.operation.length };
  },
  async metiersTree(_chantierId) {
    await wait(50);
    const m = DEMO.metiers;
    return m.corpsMetier.map((cm) => ({
      code: cm.code, libelle: cm.libelle,
      types: m.typeOuvrage.filter((t) => t.corps === cm.code).map((t) => ({
        code: t.code, libelle: t.libelle, unite: t.unite, nature: t.nature,
        activites: m.activite.filter((a) => a.corps === cm.code && a.type === t.code),
        operations: m.operation.filter((o) => o.corps === cm.code && o.type === t.code),
      })),
    }));
  },
  async metiersImportCommit(_chantierId, kept) {
    await wait(150);
    const m = { corpsMetier: [...DEMO.metiers.corpsMetier], typeOuvrage: [...DEMO.metiers.typeOuvrage], activite: [...DEMO.metiers.activite], operation: [...DEMO.metiers.operation] };
    const seenCM = new Set(m.corpsMetier.map((c) => c.code));
    const seenT = new Set(m.typeOuvrage.map((t) => t.corps + "|" + t.code));
    for (const r of kept) {
      if (!seenCM.has(r.corpsMetier)) { seenCM.add(r.corpsMetier); m.corpsMetier.push({ code: r.corpsMetier, libelle: r.corpsMetier }); }
      const tk = r.corpsMetier + "|" + r.typeCode;
      if (!seenT.has(tk)) {
        seenT.add(tk);
        m.typeOuvrage.push({ corps: r.corpsMetier, code: r.typeCode, libelle: r.typeLibelle, unite: r.unite, nature: r.nature });
        r.activites.forEach((a) => m.activite.push({ corps: r.corpsMetier, type: r.typeCode, code: a, libelle: a }));
        r.operations.forEach((o) => m.operation.push({ corps: r.corpsMetier, type: r.typeCode, code: o, libelle: o }));
      }
    }
    DEMO.metiers = m;
    return { ok: true, stats: await DB_DEMO.metiersSummary() };
  },
  async ouvrageSummary(_chantierId) {
    await wait(50);
    return { total: DEMO.ouvrages.length, aRattacher: DEMO.ouvrages.filter((o) => o.statut === "a_rattacher").length };
  },
  async ouvrageImportCommit(_chantierId, kept, _auteurId) {
    await wait(150);
    const seen = new Set(DEMO.ouvrages.map((o) => o.repere));
    for (const r of kept) {
      if (seen.has(r.repere)) continue;
      seen.add(r.repere);
      DEMO.ouvrages.push({ id: "ov-" + Math.random().toString(36).slice(2, 9), repere: r.repere, corpsMetier: r.corpsMetier, typeCode: r.typeCode, typeLibelle: r.typeLibelle, unite: r.unite, nature: r.nature, local: r.local, quantitePrevue: r.quantitePrevue, statut: "actif" });
    }
    return { ok: true, stats: await DB_DEMO.ouvrageSummary() };
  },
  async ouvrageList(_chantierId, filters) {
    await wait(60);
    let rows = DEMO.ouvrages;
    if (filters && filters.type) rows = rows.filter((o) => o.typeCode === filters.type);
    return rows.map((o) => ({ ...o, pose: 0, restant: o.quantitePrevue }));
  },

  /* ----- Phase 4 : saisie d'une déclaration et traçabilité ----- */
  async ouvrageIndex(_chantierId) {
    await wait(40);
    return DEMO.ouvrages.map((o) => ({ id: o.id, repere: o.repere, typeCode: o.typeCode, corpsMetier: o.corpsMetier, local: o.local }));
  },
  async declarationCreate(_chantierId, payload, auteurId) {
    await wait(150);
    // RF = liste fermée (référentiel BE) : on résout tous les ouvrages AVANT
    // d'écrire quoi que ce soit — aucune création à la volée.
    const metiers = DEMO.metiers;
    const resolved = [];
    for (const l of payload.lignes) {
      const ouv = DEMO.ouvrages.find((o) => o.repere === l.repere);
      if (!ouv) return { error: `Repère « ${l.repere} » introuvable au référentiel — rechargez la page et réessayez.` };
      resolved.push({ l, ouv });
    }

    const decl = {
      id: "d-" + Math.random().toString(36).slice(2, 9),
      date: payload.date, equipe: payload.equipe, local: payload.localCode, corpsMetier: payload.corpsMetierCode,
      auteurId, creeLe: new Date().toISOString(),
    };
    DEMO.declarations.push(decl);

    for (const { l, ouv } of resolved) {
      const act = metiers.activite.find((a) => a.corps === payload.corpsMetierCode && a.type === l.typeCode && a.code === l.activiteCode);
      DEMO.lignes.push({
        id: "l-" + Math.random().toString(36).slice(2, 9), declarationId: decl.id, ouvrageId: ouv.id,
        repere: l.repere, typeCode: ouv.typeCode, typeLibelle: ouv.typeLibelle, unite: ouv.unite, nature: ouv.nature,
        activiteCode: l.activiteCode, activiteLibelle: act ? act.libelle : l.activiteCode,
        quantite: l.quantite != null ? l.quantite : null, operationsFaites: l.operationsFaites || [],
        commentaire: l.commentaire || "", pointsBloquants: l.pointsBloquants || "", solde: !!l.solde,
        auteurId, creeLe: new Date().toISOString(), modifieLe: new Date().toISOString(),
      });
    }
    return { ok: true, declarationId: decl.id };
  },
  async declarationRecent(_chantierId, opts) {
    await wait(60);
    const limit = (opts && opts.limit) || 20;
    return [...DEMO.declarations]
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.creeLe < b.creeLe ? 1 : -1)))
      .slice(0, limit)
      .map((d) => ({
        id: d.id, date: d.date, equipe: d.equipe, local: d.local, corpsMetier: d.corpsMetier,
        auteurNom: (DEMO.users.find((u) => u.id === d.auteurId) || {}).nom_affiche || "—",
        lignesCount: DEMO.lignes.filter((l) => l.declarationId === d.id).length,
      }));
  },
  async declarationGet(_chantierId, declarationId) {
    await wait(50);
    const d = DEMO.declarations.find((x) => x.id === declarationId);
    if (!d) return null;
    const metiers = DEMO.metiers;
    const lignes = DEMO.lignes.filter((l) => l.declarationId === declarationId).map((l) => ({
      ...l,
      operations: metiers.operation.filter((o) => o.corps === d.corpsMetier && o.type === l.typeCode),
      activites: metiers.activite.filter((a) => a.corps === d.corpsMetier && a.type === l.typeCode),
    }));
    return { declaration: d, lignes };
  },
  async ligneUpdate(_chantierId, ligneId, patch, auteurId) {
    await wait(80);
    const l = DEMO.lignes.find((x) => x.id === ligneId);
    if (!l) return { error: "Ligne introuvable." };
    const champs = ["quantite", "operationsFaites", "commentaire", "pointsBloquants", "solde"];
    for (const champ of champs) {
      if (!(champ in patch)) continue;
      const avant = JSON.stringify(l[champ]), apres = JSON.stringify(patch[champ]);
      if (avant !== apres) {
        DEMO.journal.push({ id: "j-" + Math.random().toString(36).slice(2, 9), table: "ligne_declaration", enregistrementId: ligneId, champ, avant: l[champ], apres: patch[champ], auteurId, faitLe: new Date().toISOString() });
        l[champ] = patch[champ];
      }
    }
    l.modifieLe = new Date().toISOString();
    return { ok: true };
  },
  async journalFor(_chantierId, _table, enregistrementId) {
    await wait(40);
    return DEMO.journal.filter((j) => j.enregistrementId === enregistrementId)
      .sort((a, b) => (a.faitLe < b.faitLe ? 1 : -1))
      .map((j) => ({ ...j, auteurNom: (DEMO.users.find((u) => u.id === j.auteurId) || {}).nom_affiche || "—" }));
  },

  /* ----- Phase 5 : consultation de l'avancement ----- */
  async avancementList(_chantierId, filters) {
    await wait(90);
    const f = filters || {};
    const locInfo = Object.fromEntries(DEMO.geo.locaux.map((l) => [l.code, l]));
    const declById = Object.fromEntries(DEMO.declarations.map((d) => [d.id, d]));
    const inRange = (dateStr) => {
      if (f.dateDebut && dateStr < f.dateDebut) return false;
      if (f.dateFin && dateStr > f.dateFin) return false;
      return true;
    };

    let rows = DEMO.ouvrages.map((o) => {
      const li = locInfo[o.local] || {};
      const lignes = DEMO.lignes
        .filter((l) => l.ouvrageId === o.id)
        .map((l) => ({ ...l, decl: declById[l.declarationId] }))
        .filter((l) => l.decl && inRange(l.decl.date));
      const opsTotal = DEMO.metiers.operation.filter((op) => op.corps === o.corpsMetier && op.type === o.typeCode).length;

      let quantitePosee = null, operationsFaitesUnion = [];
      if (o.nature === "quantite") {
        quantitePosee = lignes.reduce((sum, l) => sum + (Number(l.quantite) || 0), 0);
      } else {
        const set = new Set();
        lignes.forEach((l) => (l.operationsFaites || []).forEach((code) => set.add(code)));
        operationsFaitesUnion = [...set];
      }
      const soldeAtteint = lignes.some((l) => l.solde);

      return {
        ouvrageId: o.id, repere: o.repere, local: o.local, batiment: li.batiment || "", niveau: li.niveau || "",
        corpsMetier: o.corpsMetier, typeCode: o.typeCode, typeLibelle: o.typeLibelle, unite: o.unite, nature: o.nature,
        quantitePrevue: o.quantitePrevue, quantitePosee, operationsFaitesUnion, operationsTotal: opsTotal,
        soldeAtteint, nbDeclarations: lignes.length, statut: o.statut,
      };
    });

    if (f.batiments && f.batiments.length) rows = rows.filter((r) => f.batiments.includes(r.batiment));
    if (f.niveau) rows = rows.filter((r) => r.niveau === f.niveau);
    if (f.corpsMetiers && f.corpsMetiers.length) rows = rows.filter((r) => f.corpsMetiers.includes(r.corpsMetier));
    if (f.typeOuvrages && f.typeOuvrages.length) rows = rows.filter((r) => f.typeOuvrages.includes(r.typeCode));
    if (f.texte) {
      const t = f.texte.toLowerCase();
      rows = rows.filter((r) => r.repere.toLowerCase().includes(t) || r.local.toLowerCase().includes(t) || r.typeLibelle.toLowerCase().includes(t));
    }
    return rows;
  },
  async lignesPourOuvrage(_chantierId, ouvrageId) {
    await wait(50);
    return DEMO.lignes.filter((l) => l.ouvrageId === ouvrageId).map((l) => {
      const d = DEMO.declarations.find((x) => x.id === l.declarationId);
      return {
        declarationId: l.declarationId, date: d ? d.date : "", auteurNom: (DEMO.users.find((u) => u.id === l.auteurId) || {}).nom_affiche || "—",
        quantite: l.quantite, operationsFaites: l.operationsFaites, activiteLibelle: l.activiteLibelle,
        commentaire: l.commentaire, pointsBloquants: l.pointsBloquants, solde: l.solde,
      };
    }).sort((a, b) => (a.date < b.date ? 1 : -1));
  },
};

/* =====================================================================
   Couche d'accès aux données — implémentation "cloud" / "local"
   Même interface que DB_DEMO. "cloud" = Supabase hébergé, "local" =
   Supabase auto-hébergé sur le réseau Axima (même code, autre URL —
   principe PRD n°12, neutralité de déploiement). L'authentification et
   la protection des données reposent sur Supabase Auth + RLS (SQL 001,
   002, 003) : la clé "anon" est publique par construction, la sécurité
   ne dépend jamais d'elle.
   ===================================================================== */
let _sb = null;
function supa() {
  if (!_sb) _sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  return _sb;
}

let GEO_CACHE = null; // évite de rapatrier tout le référentiel à chaque frappe de recherche

const DB_SUPABASE = {
  async login(email, password) {
    const { data, error } = await supa().auth.signInWithPassword({ email: email.trim(), password });
    if (error) {
      if (/confirm/i.test(error.message))
        return { error: "E-mail non confirmé côté Supabase. Tableau de bord → Authentication → Users → ouvrez le compte → confirmez l'e-mail (ou recréez-le en cochant « Auto Confirm User »)." };
      return { error: "Connexion refusée par Supabase : " + error.message };
    }
    const uid = data.user.id;
    const { data: au, error: e2 } = await supa().from("app_user").select("*").eq("id", uid).maybeSingle();
    if (e2 || !au) {
      await supa().auth.signOut();
      return { error: "Compte authentifié mais pas encore rattaché à un chantier. Contactez l'ingénieur DATA." };
    }
    if (!au.actif) { await supa().auth.signOut(); return { error: "Ce compte est désactivé. Contactez l'ingénieur DATA." }; } // RG-2
    return { user: au };
  },
  async chantiersOf(userId) {
    const { data, error } = await supa()
      .from("membership")
      .select("role, chantier:chantier_id(id,code,libelle,actif)")
      .eq("user_id", userId);
    if (error) { console.error(error); return []; }
    return (data || []).filter((m) => m.chantier && m.chantier.actif).map((m) => ({ ...m.chantier, role: m.role }));
  },
  async roleOf(chantierId, userId) {
    const { data } = await supa().from("membership").select("role").eq("chantier_id", chantierId).eq("user_id", userId).maybeSingle();
    return data ? data.role : null;
  },
  async members(chantierId) {
    const { data, error } = await supa()
      .from("membership")
      .select("role, app_user:user_id(id,email,nom_affiche,actif)")
      .eq("chantier_id", chantierId);
    if (error) { console.error(error); return []; }
    return (data || []).filter((m) => m.app_user).map((m) => ({ ...m.app_user, role: m.role }));
  },
  async createMember(chantierId, { email, nom_affiche, role }) {
    const { data, error } = await supa().rpc("admin_creer_membre", {
      p_chantier_id: chantierId, p_email: email.trim(), p_nom: nom_affiche.trim(), p_role: role,
    });
    if (error) return { error: error.message };
    if (data && data.error) return { error: data.error };
    return { ok: true };
  },
  async setActive(userId, actif) {
    const { error } = await supa().from("app_user").update({ actif }).eq("id", userId);
    if (error) return { error: error.message };
    return { ok: true };
  },
  async setRole(chantierId, userId, role) {
    const { error } = await supa().from("membership").update({ role }).eq("chantier_id", chantierId).eq("user_id", userId);
    if (error) return { error: error.message };
    return { ok: true };
  },

  /* ----- Phase 2 : référentiel géographique ----- */
  async geoSummary(chantierId) {
    const [b, n, z, l] = await Promise.all([
      supa().from("batiment").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("niveau").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("zone").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("local").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
    ]);
    return { batiments: b.count || 0, niveaux: n.count || 0, zones: z.count || 0, locaux: l.count || 0 };
  },
  async geoTree(chantierId) {
    const [b, n, z, l] = await Promise.all([
      supa().from("batiment").select("*").eq("chantier_id", chantierId).order("code"),
      supa().from("niveau").select("*").eq("chantier_id", chantierId).order("code"),
      supa().from("zone").select("*").eq("chantier_id", chantierId).order("code_seva"),
      supa().from("local").select("*").eq("chantier_id", chantierId).order("code"),
    ]);
    const batiments = b.data || [], niveaux = n.data || [], zones = z.data || [], locaux = l.data || [];
    GEO_CACHE = { batiments, niveaux, zones, locaux };
    return batiments.map((bt) => ({
      code: bt.code,
      niveaux: niveaux.filter((nv) => nv.batiment_id === bt.id).map((nv) => ({
        code: nv.code,
        zones: zones.filter((zn) => zn.niveau_id === nv.id).map((zn) => ({
          code_seva: zn.code_seva, code_int: zn.code_interne,
          locaux: locaux.filter((lc) => lc.zone_id === zn.id).map((lc) => ({
            code: lc.code, zone_cea: zn.code_seva, zone_int: zn.code_interne, niveau: nv.code, batiment: bt.code,
          })),
        })),
      })),
    }));
  },
  async geoFindLocal(chantierId, term) {
    if (!GEO_CACHE) await DB_SUPABASE.geoTree(chantierId);
    const t = term.trim().toLowerCase();
    if (!t) return [];
    const { batiments, niveaux, zones, locaux } = GEO_CACHE;
    const byId = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));
    const bB = byId(batiments), bN = byId(niveaux), bZ = byId(zones);
    return locaux
      .filter((l) => l.code.toLowerCase().includes(t) || (bZ[l.zone_id]?.code_interne || "").toLowerCase().includes(t) || (bZ[l.zone_id]?.code_seva || "").toLowerCase().includes(t))
      .slice(0, 40)
      .map((l) => { const z = bZ[l.zone_id], n = bN[z.niveau_id], bt = bB[n.batiment_id];
        return { code: l.code, zone_cea: z.code_seva, zone_int: z.code_interne, niveau: n.code, batiment: bt.code }; });
  },
  async geoImportCommit(chantierId, kept, auteurId) {
    const sb = supa();
    const uniq = (arr) => [...new Set(arr)];

    const codesB = uniq(kept.map((r) => r.batiment));
    await sb.from("batiment").upsert(codesB.map((code) => ({ chantier_id: chantierId, code })), { onConflict: "chantier_id,code", ignoreDuplicates: true });
    const { data: allB } = await sb.from("batiment").select("id,code").eq("chantier_id", chantierId);
    const idB = Object.fromEntries(allB.map((b) => [b.code, b.id]));

    const niv = uniq(kept.map((r) => r.batiment + "|" + r.niveau)).map((k) => { const [batiment, code] = k.split("|"); return { chantier_id: chantierId, batiment_id: idB[batiment], code }; });
    await sb.from("niveau").upsert(niv, { onConflict: "batiment_id,code", ignoreDuplicates: true });
    const { data: allN } = await sb.from("niveau").select("id,code,batiment_id").eq("chantier_id", chantierId);
    const idN = Object.fromEntries(allN.map((n) => [n.batiment_id + "|" + n.code, n.id]));

    const zn = uniq(kept.map((r) => r.batiment + "|" + r.niveau + "|" + r.zoneCea)).map((k) => { const [batiment, niveau, code_seva] = k.split("|"); const r = kept.find((x) => x.batiment === batiment && x.niveau === niveau && x.zoneCea === code_seva); return { chantier_id: chantierId, niveau_id: idN[idB[batiment] + "|" + niveau], code_seva, code_interne: r.zoneInt || null }; });
    await sb.from("zone").upsert(zn, { onConflict: "niveau_id,code_seva", ignoreDuplicates: true });
    const { data: allZ } = await sb.from("zone").select("id,code_seva,niveau_id").eq("chantier_id", chantierId);
    const idZ = Object.fromEntries(allZ.map((z) => [z.niveau_id + "|" + z.code_seva, z.id]));

    const loc = uniq(kept.map((r) => r.local)).map((code) => { const r = kept.find((x) => x.local === code); const nid = idN[idB[r.batiment] + "|" + r.niveau]; return { chantier_id: chantierId, zone_id: idZ[nid + "|" + r.zoneCea], code }; });
    await sb.from("local").upsert(loc, { onConflict: "chantier_id,code", ignoreDuplicates: true });

    await sb.from("import_lot").insert({ chantier_id: chantierId, type: "geo", statut: "valide", lignes_retenues: kept.length, auteur_id: auteurId, valide_le: new Date().toISOString() });

    GEO_CACHE = null; // invalide le cache de recherche
    return { ok: true, stats: await DB_SUPABASE.geoSummary(chantierId) };
  },

  /* ----- Phase 3 : référentiel ouvrages, métiers, activités ----- */
  async metiersSummary(chantierId) {
    const [cm, to, ac, op] = await Promise.all([
      supa().from("corps_metier").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("type_ouvrage").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("activite").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("operation").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
    ]);
    return { corpsMetier: cm.count || 0, typeOuvrage: to.count || 0, activites: ac.count || 0, operations: op.count || 0 };
  },
  async metiersTree(chantierId) {
    const [cm, to, ac, op] = await Promise.all([
      supa().from("corps_metier").select("*").eq("chantier_id", chantierId).order("code"),
      supa().from("type_ouvrage").select("*").eq("chantier_id", chantierId).order("code"),
      supa().from("activite").select("*").eq("chantier_id", chantierId).order("code"),
      supa().from("operation").select("*").eq("chantier_id", chantierId).order("code"),
    ]);
    const corpsMetier = cm.data || [], typeOuvrage = to.data || [], activite = ac.data || [], operation = op.data || [];
    METIERS_CACHE = { corpsMetier, typeOuvrage, activite, operation };
    return corpsMetier.map((c) => ({
      code: c.code, libelle: c.libelle,
      types: typeOuvrage.filter((t) => t.corps_metier_id === c.id).map((t) => ({
        code: t.code, libelle: t.libelle, unite: t.unite, nature: t.nature,
        activites: activite.filter((a) => a.type_ouvrage_id === t.id),
        operations: operation.filter((o) => o.type_ouvrage_id === t.id),
      })),
    }));
  },
  async metiersImportCommit(chantierId, kept) {
    const sb = supa();
    const uniq = (arr) => [...new Set(arr)];

    const cmCodes = uniq(kept.map((r) => r.corpsMetier));
    await sb.from("corps_metier").upsert(cmCodes.map((code) => ({ chantier_id: chantierId, code, libelle: code })), { onConflict: "chantier_id,code", ignoreDuplicates: true });
    const { data: allCM } = await sb.from("corps_metier").select("id,code").eq("chantier_id", chantierId);
    const idCM = Object.fromEntries(allCM.map((c) => [c.code, c.id]));

    const types = kept.map((r) => ({ chantier_id: chantierId, corps_metier_id: idCM[r.corpsMetier], code: r.typeCode, libelle: r.typeLibelle, unite: r.unite || "u", nature: r.nature }));
    await sb.from("type_ouvrage").upsert(types, { onConflict: "corps_metier_id,code", ignoreDuplicates: true });
    const { data: allT } = await sb.from("type_ouvrage").select("id,code,corps_metier_id").eq("chantier_id", chantierId);
    const idT = Object.fromEntries(allT.map((t) => [t.corps_metier_id + "|" + t.code, t.id]));

    const activites = [], operations = [];
    kept.forEach((r) => {
      const tid = idT[idCM[r.corpsMetier] + "|" + r.typeCode];
      r.activites.forEach((a) => activites.push({ chantier_id: chantierId, type_ouvrage_id: tid, code: a, libelle: a }));
      r.operations.forEach((o) => operations.push({ chantier_id: chantierId, type_ouvrage_id: tid, code: o, libelle: o }));
    });
    if (activites.length) await sb.from("activite").upsert(activites, { onConflict: "type_ouvrage_id,code", ignoreDuplicates: true });
    if (operations.length) await sb.from("operation").upsert(operations, { onConflict: "type_ouvrage_id,code", ignoreDuplicates: true });

    METIERS_CACHE = null;
    return { ok: true, stats: await DB_SUPABASE.metiersSummary(chantierId) };
  },
  async ouvrageSummary(chantierId) {
    const [tot, ar] = await Promise.all([
      supa().from("ouvrage").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId),
      supa().from("ouvrage").select("id", { count: "exact", head: true }).eq("chantier_id", chantierId).eq("statut", "a_rattacher"),
    ]);
    return { total: tot.count || 0, aRattacher: ar.count || 0 };
  },
  async ouvrageImportCommit(chantierId, kept, auteurId) {
    const sb = supa();
    if (!METIERS_CACHE) await DB_SUPABASE.metiersTree(chantierId);
    const idCM = Object.fromEntries(METIERS_CACHE.corpsMetier.map((c) => [c.code, c.id]));
    const idT = Object.fromEntries(METIERS_CACHE.typeOuvrage.map((t) => [t.corps_metier_id + "|" + t.code, t.id]));
    const { data: allLoc } = await sb.from("local").select("id,code").eq("chantier_id", chantierId);
    const idL = Object.fromEntries((allLoc || []).map((l) => [l.code, l.id]));

    const rows = kept.map((r) => ({
      chantier_id: chantierId,
      repere_fonctionnel: r.repere,
      local_id: idL[r.local],
      type_ouvrage_id: idT[idCM[r.corpsMetier] + "|" + r.typeCode],
      quantite_prevue: r.quantitePrevue,
      statut: "actif",
    }));
    await sb.from("ouvrage").upsert(rows, { onConflict: "chantier_id,repere_fonctionnel", ignoreDuplicates: true });
    await sb.from("import_lot").insert({ chantier_id: chantierId, type: "ouvrages", statut: "valide", lignes_retenues: kept.length, auteur_id: auteurId, valide_le: new Date().toISOString() });

    return { ok: true, stats: await DB_SUPABASE.ouvrageSummary(chantierId) };
  },
  async ouvrageList(chantierId, filters) {
    const { data, error } = await supa()
      .from("ouvrage")
      .select("repere_fonctionnel, quantite_prevue, statut, type_ouvrage:type_ouvrage_id(code,libelle,unite,nature,corps_metier:corps_metier_id(code)), local:local_id(code)")
      .eq("chantier_id", chantierId);
    if (error) { console.error(error); return []; }
    let rows = (data || []).map((o) => ({
      repere: o.repere_fonctionnel, quantitePrevue: o.quantite_prevue, statut: o.statut,
      typeCode: o.type_ouvrage && o.type_ouvrage.code, typeLibelle: o.type_ouvrage && o.type_ouvrage.libelle,
      unite: o.type_ouvrage && o.type_ouvrage.unite, nature: o.type_ouvrage && o.type_ouvrage.nature,
      corpsMetier: o.type_ouvrage && o.type_ouvrage.corps_metier && o.type_ouvrage.corps_metier.code,
      local: o.local && o.local.code,
      pose: 0, restant: o.quantite_prevue,
    }));
    if (filters && filters.type) rows = rows.filter((r) => r.typeCode === filters.type);
    return rows;
  },

  /* ----- Phase 4 : saisie d'une déclaration et traçabilité ----- */
  async ouvrageIndex(chantierId) {
    const { data, error } = await supa()
      .from("ouvrage")
      .select("id, repere_fonctionnel, type_ouvrage:type_ouvrage_id(code, corps_metier:corps_metier_id(code)), local:local_id(code)")
      .eq("chantier_id", chantierId);
    if (error) { console.error(error); return []; }
    return (data || []).map((o) => ({ id: o.id, repere: o.repere_fonctionnel, typeCode: o.type_ouvrage && o.type_ouvrage.code, corpsMetier: o.type_ouvrage && o.type_ouvrage.corps_metier && o.type_ouvrage.corps_metier.code, local: o.local && o.local.code }));
  },
  async declarationCreate(chantierId, payload, auteurId) {
    const sb = supa();
    if (!METIERS_CACHE) await DB_SUPABASE.metiersTree(chantierId);
    const idCM = Object.fromEntries(METIERS_CACHE.corpsMetier.map((c) => [c.code, c.id]));
    const idT = Object.fromEntries(METIERS_CACHE.typeOuvrage.map((t) => [t.corps_metier_id + "|" + t.code, t.id]));
    const idA = Object.fromEntries(METIERS_CACHE.activite.map((a) => [a.type_ouvrage_id + "|" + a.code, a.id]));

    const { data: locRow, error: locErr } = await sb.from("local").select("id").eq("chantier_id", chantierId).eq("code", payload.localCode).maybeSingle();
    if (locErr || !locRow) return { error: "Local introuvable au référentiel géographique." };
    const cmId = idCM[payload.corpsMetierCode];

    // RF = liste fermée (référentiel BE) : on résout tous les ouvrages AVANT
    // d'écrire quoi que ce soit — aucune création à la volée.
    const reperes = [...new Set(payload.lignes.map((l) => l.repere))];
    const { data: ouvRows, error: ouvErr } = await sb.from("ouvrage").select("id, repere_fonctionnel").eq("chantier_id", chantierId).in("repere_fonctionnel", reperes);
    if (ouvErr) return { error: ouvErr.message };
    const idOuv = Object.fromEntries((ouvRows || []).map((o) => [o.repere_fonctionnel, o.id]));
    const manquant = reperes.find((r) => !idOuv[r]);
    if (manquant) return { error: `Repère « ${manquant} » introuvable au référentiel — rechargez la page et réessayez.` };

    const { data: decl, error: declErr } = await sb.from("declaration").insert({
      chantier_id: chantierId, date_decl: payload.date, equipe: payload.equipe || null, local_id: locRow.id, corps_metier_id: cmId, auteur_id: auteurId,
    }).select("id").single();
    if (declErr) return { error: declErr.message };

    const lignesRows = [];
    for (const l of payload.lignes) {
      const tId = idT[cmId + "|" + l.typeCode];
      const aId = idA[tId + "|" + l.activiteCode] || null;
      lignesRows.push({
        chantier_id: chantierId, declaration_id: decl.id, ouvrage_id: idOuv[l.repere], activite_id: aId,
        quantite: l.quantite, operations_faites: l.operationsFaites || [], commentaire: l.commentaire || null, points_bloquants: l.pointsBloquants || null, solde: !!l.solde, auteur_id: auteurId,
      });
    }
    if (lignesRows.length) {
      const { error: lErr } = await sb.from("ligne_declaration").insert(lignesRows);
      if (lErr) return { error: lErr.message };
    }
    return { ok: true, declarationId: decl.id };
  },
  async declarationRecent(chantierId, opts) {
    const limit = (opts && opts.limit) || 20;
    const { data: decls, error } = await supa()
      .from("declaration")
      .select("id,date_decl,equipe,local:local_id(code),corps_metier:corps_metier_id(code),auteur:auteur_id(nom_affiche)")
      .eq("chantier_id", chantierId)
      .order("date_decl", { ascending: false })
      .order("cree_le", { ascending: false })
      .limit(limit);
    if (error) { console.error(error); return []; }
    const ids = (decls || []).map((d) => d.id);
    const counts = {};
    if (ids.length) {
      const { data: lignes } = await supa().from("ligne_declaration").select("declaration_id").in("declaration_id", ids);
      (lignes || []).forEach((l) => { counts[l.declaration_id] = (counts[l.declaration_id] || 0) + 1; });
    }
    return (decls || []).map((d) => ({
      id: d.id, date: d.date_decl, equipe: d.equipe,
      local: d.local && d.local.code, corpsMetier: d.corps_metier && d.corps_metier.code,
      auteurNom: (d.auteur && d.auteur.nom_affiche) || "—", lignesCount: counts[d.id] || 0,
    }));
  },
  async declarationGet(chantierId, declarationId) {
    const sb = supa();
    const { data: d } = await sb.from("declaration").select("id,date_decl,equipe,local:local_id(code),corps_metier:corps_metier_id(code)").eq("id", declarationId).maybeSingle();
    if (!d) return null;
    if (!METIERS_CACHE) await DB_SUPABASE.metiersTree(chantierId);
    const { data: lignesRaw } = await sb
      .from("ligne_declaration")
      .select("id,quantite,operations_faites,commentaire,points_bloquants,solde,ouvrage:ouvrage_id(repere_fonctionnel,type_ouvrage_id),activite:activite_id(code,libelle)")
      .eq("declaration_id", declarationId);
    const typeById = Object.fromEntries(METIERS_CACHE.typeOuvrage.map((t) => [t.id, t]));
    const lignes = (lignesRaw || []).map((l) => {
      const tid = l.ouvrage && l.ouvrage.type_ouvrage_id;
      const t = typeById[tid];
      return {
        id: l.id, repere: l.ouvrage && l.ouvrage.repere_fonctionnel,
        typeCode: t && t.code, typeLibelle: t && t.libelle, unite: t && t.unite, nature: t && t.nature,
        activiteCode: l.activite && l.activite.code, activiteLibelle: l.activite && l.activite.libelle,
        quantite: l.quantite, operationsFaites: l.operations_faites || [], commentaire: l.commentaire, pointsBloquants: l.points_bloquants, solde: l.solde,
        operations: METIERS_CACHE.operation.filter((o) => o.type_ouvrage_id === tid),
        activites: METIERS_CACHE.activite.filter((a) => a.type_ouvrage_id === tid),
      };
    });
    return { declaration: { id: d.id, date: d.date_decl, equipe: d.equipe, local: d.local && d.local.code, corpsMetier: d.corps_metier && d.corps_metier.code }, lignes };
  },
  async ligneUpdate(chantierId, ligneId, patch, auteurId) {
    const sb = supa();
    const { data: before } = await sb.from("ligne_declaration").select("quantite,operations_faites,commentaire,points_bloquants,solde").eq("id", ligneId).maybeSingle();
    if (!before) return { error: "Ligne introuvable." };
    const colMap = { quantite: "quantite", operationsFaites: "operations_faites", commentaire: "commentaire", pointsBloquants: "points_bloquants", solde: "solde" };
    const updates = {}; const journalRows = [];
    for (const champ of Object.keys(colMap)) {
      if (!(champ in patch)) continue;
      const col = colMap[champ];
      const avant = JSON.stringify(before[col]), apres = JSON.stringify(patch[champ]);
      if (avant !== apres) {
        updates[col] = patch[champ];
        journalRows.push({ chantier_id: chantierId, table_cible: "ligne_declaration", enregistrement_id: ligneId, champ, ancienne_valeur: avant, nouvelle_valeur: apres, auteur_id: auteurId });
      }
    }
    if (Object.keys(updates).length) {
      updates.modifie_le = new Date().toISOString();
      const { error } = await sb.from("ligne_declaration").update(updates).eq("id", ligneId);
      if (error) return { error: error.message };
      if (journalRows.length) await sb.from("journal_modification").insert(journalRows);
    }
    return { ok: true };
  },
  async journalFor(chantierId, table, enregistrementId) {
    const { data, error } = await supa()
      .from("journal_modification")
      .select("champ,ancienne_valeur,nouvelle_valeur,fait_le,auteur:auteur_id(nom_affiche)")
      .eq("chantier_id", chantierId).eq("table_cible", table).eq("enregistrement_id", enregistrementId)
      .order("fait_le", { ascending: false });
    if (error) { console.error(error); return []; }
    return (data || []).map((j) => ({ champ: j.champ, avant: j.ancienne_valeur, apres: j.nouvelle_valeur, auteurNom: (j.auteur && j.auteur.nom_affiche) || "—", faitLe: j.fait_le }));
  },

  /* ----- Phase 5 : consultation de l'avancement ----- */
  async avancementList(chantierId, filters) {
    const sb = supa();
    const f = filters || {};

    const { data: ouvrages, error } = await sb
      .from("ouvrage")
      .select("id, repere_fonctionnel, quantite_prevue, statut, type_ouvrage:type_ouvrage_id(id, code, libelle, unite, nature, corps_metier:corps_metier_id(code)), local:local_id(code, zone:zone_id(niveau:niveau_id(code, batiment:batiment_id(code))))")
      .eq("chantier_id", chantierId);
    if (error) { console.error(error); return []; }

    const { data: lignesRaw, error: lErr } = await sb
      .from("ligne_declaration")
      .select("ouvrage_id, quantite, operations_faites, solde, declaration:declaration_id(date_decl)")
      .eq("chantier_id", chantierId);
    if (lErr) { console.error(lErr); return []; }

    const lignesByOuvrage = {};
    (lignesRaw || []).forEach((l) => {
      const dateStr = l.declaration && l.declaration.date_decl;
      if (f.dateDebut && dateStr < f.dateDebut) return;
      if (f.dateFin && dateStr > f.dateFin) return;
      (lignesByOuvrage[l.ouvrage_id] = lignesByOuvrage[l.ouvrage_id] || []).push(l);
    });

    if (!METIERS_CACHE) await DB_SUPABASE.metiersTree(chantierId);
    const opsCountByType = {};
    METIERS_CACHE.operation.forEach((o) => { opsCountByType[o.type_ouvrage_id] = (opsCountByType[o.type_ouvrage_id] || 0) + 1; });

    let rows = (ouvrages || []).map((o) => {
      const t = o.type_ouvrage || {};
      const cm = t.corps_metier || {};
      const loc = o.local || {};
      const niveau = (loc.zone && loc.zone.niveau) || {};
      const batiment = niveau.batiment || {};
      const lignes = lignesByOuvrage[o.id] || [];
      const opsTotal = t.id ? (opsCountByType[t.id] || 0) : 0;

      let quantitePosee = null, operationsFaitesUnion = [];
      if (t.nature === "quantite") {
        quantitePosee = lignes.reduce((sum, l) => sum + (Number(l.quantite) || 0), 0);
      } else {
        const set = new Set();
        lignes.forEach((l) => (l.operations_faites || []).forEach((code) => set.add(code)));
        operationsFaitesUnion = [...set];
      }
      const soldeAtteint = lignes.some((l) => l.solde);

      return {
        ouvrageId: o.id, repere: o.repere_fonctionnel, local: loc.code, batiment: batiment.code || "", niveau: niveau.code || "",
        corpsMetier: cm.code, typeCode: t.code, typeLibelle: t.libelle, unite: t.unite, nature: t.nature,
        quantitePrevue: o.quantite_prevue, quantitePosee, operationsFaitesUnion, operationsTotal: opsTotal,
        soldeAtteint, nbDeclarations: lignes.length, statut: o.statut,
      };
    });

    if (f.batiments && f.batiments.length) rows = rows.filter((r) => f.batiments.includes(r.batiment));
    if (f.niveau) rows = rows.filter((r) => r.niveau === f.niveau);
    if (f.corpsMetiers && f.corpsMetiers.length) rows = rows.filter((r) => f.corpsMetiers.includes(r.corpsMetier));
    if (f.typeOuvrages && f.typeOuvrages.length) rows = rows.filter((r) => f.typeOuvrages.includes(r.typeCode));
    if (f.texte) {
      const tx = f.texte.toLowerCase();
      rows = rows.filter((r) => (r.repere || "").toLowerCase().includes(tx) || (r.local || "").toLowerCase().includes(tx) || (r.typeLibelle || "").toLowerCase().includes(tx));
    }
    return rows;
  },
  async lignesPourOuvrage(chantierId, ouvrageId) {
    const { data, error } = await supa()
      .from("ligne_declaration")
      .select("declaration_id, quantite, operations_faites, commentaire, points_bloquants, solde, activite:activite_id(libelle), declaration:declaration_id(date_decl), auteur:auteur_id(nom_affiche)")
      .eq("chantier_id", chantierId).eq("ouvrage_id", ouvrageId);
    if (error) { console.error(error); return []; }
    return (data || [])
      .map((l) => ({
        declarationId: l.declaration_id, date: l.declaration && l.declaration.date_decl, auteurNom: (l.auteur && l.auteur.nom_affiche) || "—",
        quantite: l.quantite, operationsFaites: l.operations_faites, activiteLibelle: l.activite && l.activite.libelle,
        commentaire: l.commentaire, pointsBloquants: l.points_bloquants, solde: l.solde,
      }))
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  },
};

   données change (principe PRD n°12). */
const DB = CONFIG.mode === "demo" ? DB_DEMO : DB_SUPABASE;

/* =====================================================================
   Session (survit à un rechargement via sessionStorage)
   ===================================================================== */
const ROLE_LABEL = {
  ingenieur_data: "Ingénieur DATA",
  saisisseur: "Saisisseur",
  consultant: "Consultant",
  admin: "Administrateur",
};
const PEUT_GERER_COMPTES = (role) => role === "ingenieur_data" || role === "admin"; // RG-5
const PEUT_SAISIR = (role) => role === "saisisseur" || role === "ingenieur_data" || role === "admin"; // US-13

const Session = {
  get() { try { return JSON.parse(sessionStorage.getItem("d08.session") || "null"); } catch { return null; } },
  set(s) { sessionStorage.setItem("d08.session", JSON.stringify(s)); },
  clear() { sessionStorage.removeItem("d08.session"); },
};

/* =====================================================================
   Utilitaires d'affichage
   ===================================================================== */
const $ = (sel, el = document) => el.querySelector(sel);
const root = () => document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let toastTimer;
function toast(msg, kind) {
  clearTimeout(toastTimer);
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (kind === "err" ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3600);
}

function go(hash) { location.hash = hash; }

/* =====================================================================
   Routeur
   ===================================================================== */
async function route() {
  const s = Session.get();
  const hash = location.hash.replace(/^#/, "") || "/";

  if (!s) return renderLogin();
  if (!s.chantier) return renderChantierPick(s);

  if (hash.startsWith("/comptes")) return renderComptes(s);
  if (hash.startsWith("/referentiels/geo")) return renderGeo(s);
  if (hash.startsWith("/referentiels/ouvrages")) return renderOuvrages(s);
  if (hash.startsWith("/referentiels")) return renderReferentiels(s);
  if (hash.startsWith("/saisie")) return renderSaisie(s);
  if (hash.startsWith("/avancement")) return renderAvancement(s);
  return renderAccueil(s);
}
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);

          <input class="inp" id="lg-pass" type="password" autocomplete="current-password">

/* =====================================================================
   Écran — Choix du chantier (RG-3)
   ===================================================================== */
async function renderChantierPick(s) {
  root().innerHTML = `<div class="centered"><div class="auth"><div class="kick">Bonjour ${esc(s.user.nom_affiche)}</div><h1>Chantier</h1><div class="sub">Chargement…</div></div></div>`;
  const list = await DB.chantiersOf(s.user.id);

  if (list.length === 0) {
    root().innerHTML = `<div class="centered"><div class="auth">
      <div class="kick">Bonjour ${esc(s.user.nom_affiche)}</div>
      <h1>Aucun chantier</h1>
      <div class="sub">Votre compte n'est rattaché à aucun chantier. Contactez l'ingénieur DATA.</div>
      <button class="btn secondary" id="lo">Se déconnecter</button>
    </div></div>`;
    $("#lo").onclick = deconnexion;
    return;
  }
  if (list.length === 1) { // RG-3 — un seul chantier : accès direct
    Session.set({ ...s, chantier: { id: list[0].id, code: list[0].code, libelle: list[0].libelle }, role: list[0].role });
    return route();
  }
  root().innerHTML = `<div class="centered"><div class="auth">
    <div class="kick">Bonjour ${esc(s.user.nom_affiche)}</div>
    <h1>Choisir un chantier</h1>
    <div class="sub">Vous avez accès à ${list.length} chantiers.</div>
    <div class="pick">
      ${list.map((c) => `<button data-id="${c.id}">
        <span><span class="code">${esc(c.code)}</span><br><span class="lib">${esc(c.libelle)}</span></span>
        <span class="role">${ROLE_LABEL[c.role]}</span>
      </button>`).join("")}
    </div>
    <div class="hint"><a href="#" id="lo">Se déconnecter</a></div>
  </div></div>`;
  root().querySelectorAll(".pick button").forEach((b) => b.onclick = () => {
    const c = list.find((x) => x.id === b.dataset.id);
    Session.set({ ...s, chantier: { id: c.id, code: c.code, libelle: c.libelle }, role: c.role });
    route();
  });
  $("#lo").onclick = (e) => { e.preventDefault(); deconnexion(); };
}

function deconnexion() { Session.clear(); go("/"); route(); }
function changerChantier() { const s = Session.get(); Session.set({ user: s.user, chantier: null }); go("/"); route(); }

  shell(s, "comptes", "Comptes", `<div class="card"><div class="muted">Chargement…</div></div>`);
  const members = await DB.members(s.chantier.id);

  const roleOpts = (sel) => Object.entries(ROLE_LABEL)
    .map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${v}</option>`).join("");

  $(".content").innerHTML = `
    <div class="spread">
      <h2 style="margin:0">Comptes du chantier</h2>
      <span class="muted">${members.length} compte${members.length > 1 ? "s" : ""}</span>

    <table class="grid">
      <thead><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Statut</th><th></th></tr></thead>
      <tbody>
        ${members.map((m) => `
          <tr data-uid="${m.id}">
            <td>${esc(m.nom_affiche)}</td>
            <td class="mono" style="font-size:12px">${esc(m.email)}</td>
            <td>
              <select class="inp js-role" style="padding:4px 26px 4px 8px;font-size:12.5px;width:auto"${m.id === s.user.id ? " disabled" : ""}>

            </td>
            <td>${m.actif ? '<span class="bdg on">Actif</span>' : '<span class="bdg off">Désactivé</span>'}</td>
            <td style="text-align:right">
              ${m.id === s.user.id ? '<span class="hint">vous</span>'
                : `<button class="btn secondary small js-toggle">${m.actif ? "Désactiver" : "Réactiver"}</button>`}

    const tg = tr.querySelector(".js-toggle");
    if (tg) tg.onclick = async () => {
      const m = members.find((x) => x.id === uid);
      await DB.setActive(uid, !m.actif);
      toast(m.actif ? "Compte désactivé." : "Compte réactivé.");
      renderComptes(Session.get());
    };
    const rs = tr.querySelector(".js-role");
    if (rs && !rs.disabled) rs.onchange = async () => {
      await DB.setRole(s.chantier.id, uid, rs.value);
      toast("Rôle mis à jour — " + ROLE_LABEL[rs.value] + ".");
    };

  $("#newf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#n-go"); btn.disabled = true;

      nom_affiche: $("#n-nom").value.trim(),
      email: $("#n-email").value.trim(),
      role: $("#n-role").value,

    btn.disabled = false;
    if (res.error) return toast(res.error, "err");
    toast("Compte créé.");
    renderComptes(Session.get());
  });
}

/* Analyse d'un contenu CSV géographique — sépare le bon grain
   (lignes retenables) des anomalies, listées ligne par ligne (RG-11). */
function analyseGeoCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim() !== "");
  if (!lines.length) return { erreurGlobale: "Fichier vide." };
  // détecte le séparateur sur l'en-tête
  const head = lines[0];
  const sep = (head.match(/;/g) || []).length >= (head.match(/,/g) || []).length ? ";" : ",";
  const isHeader = /b[aâ]timent/i.test(head);
  const body = isHeader ? lines.slice(1) : lines;

  const rows = [];
  const vusLocal = new Map();
  const c = { erreur: 0, doublon: 0, avert: 0, ok: 0 };

  body.forEach((raw, i) => {
    const cols = raw.split(sep).map((x) => x.trim());
    const [batiment = "", niveau = "", zoneCea = "", zoneInt = "", local = ""] = cols;
    const problems = [];

    if (!batiment || !niveau || !zoneCea || !local)
      problems.push({ level: "erreur", msg: "ligne incomplète (bâtiment, niveau, zone CEA et local sont obligatoires)" });

    if (local && (local === "//" || local === niveau))
      problems.push({ level: "avert", msg: "local non nommé — à préciser avec les équipes" });

    if (!zoneInt || /^none$/i.test(zoneInt))
      problems.push({ level: "avert", msg: "désignation interne manquante — la désignation SEVA sera utilisée" });

    let doublon = false;
    if (local) {
      if (vusLocal.has(local)) { doublon = true; problems.push({ level: "doublon", msg: "local déjà présent ligne " + vusLocal.get(local) }); }
      else vusLocal.set(local, i + (isHeader ? 2 : 1));
    }

    const bloquant = problems.some((p) => p.level === "erreur") || doublon;
    if (bloquant) { if (doublon) c.doublon++; else c.erreur++; }
    else if (problems.length) c.avert++;
    else c.ok++;

    rows.push({ line: i + (isHeader ? 2 : 1), batiment, niveau, zoneCea, zoneInt, local, problems, bloquant });
  });

  const kept = rows.filter((r) => !r.bloquant);
  const uniq = (arr) => [...new Set(arr)];
  const stats = {
    lignes: rows.length,
    batiments: uniq(kept.map((r) => r.batiment)).length,
    niveaux: uniq(kept.map((r) => r.batiment + "|" + r.niveau)).length,
    zones: uniq(kept.map((r) => r.niveau + "|" + r.zoneCea)).length,
    locaux: uniq(kept.map((r) => r.local)).length,
  };
  return { rows, kept, stats, counts: c, sep, avaitEntete: isHeader };
}

let GEO_PENDING = null; // analyse en attente de validation

async function renderGeo(s) {
  if (!PEUT_GERER_COMPTES(s.role)) { go("/"); return route(); }
  shell(s, "referentiels", "Référentiel géographique", '<div class="card"><div class="muted">Chargement…</div></div>');
  const sum = await DB.geoSummary(s.chantier.id);

  $(".content").innerHTML = `
    <div class="spread">
      <h2 style="margin:0"><a href="#/referentiels" style="font-weight:400;font-size:13px">Référentiels</a> &nbsp;›&nbsp; Géographique</h2>
      <span class="muted">${sum.locaux ? `${sum.locaux} locaux` : "vide"}</span>
    </div>

    <div class="card" style="margin-bottom:18px">
      <h3 style="margin-bottom:10px">Importer</h3>
      <p class="hint" style="margin-top:0">Format attendu : une ligne par local — <span class="mono">Bâtiment ; Niveau ; Zone (CEA) ; Zone (interne) ; Local</span>. Séparateur <span class="mono">;</span> ou <span class="mono">,</span>.</p>
      <div class="row" style="margin-top:6px">
        <input type="file" id="geo-file" accept=".csv,text/csv,text/plain" class="inp" style="max-width:280px">
        <button class="btn secondary small" id="geo-demo">Charger le jeu RJH de démonstration</button>
      </div>
      <div class="field" style="margin-top:12px">
        <label>… ou coller les lignes</label>
        <textarea class="inp" id="geo-paste" rows="4" placeholder="Bâtiment;Niveau;Zone (CEA);Zone (interne);Local&#10;BUA;UA+1;UA+1ZM10;Hors-ZRF;UA+1S01"></textarea>
      </div>
      <button class="btn primary" id="geo-analyse">Prévisualiser</button>
      <div id="geo-preview"></div>
    </div>

    <div id="geo-browse"></div>
  `;

  $("#geo-demo").onclick = () => { $("#geo-paste").value = GEO_DEMO_CSV; toast("Jeu de démonstration chargé — cliquez « Prévisualiser »."); };
  $("#geo-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $("#geo-paste").value = rd.result; toast("Fichier lu — cliquez « Prévisualiser »."); };
    rd.readAsText(f, "utf-8");
  };
  $("#geo-analyse").onclick = () => {
    const txt = $("#geo-paste").value.trim();
    if (!txt) return toast("Aucune donnée à prévisualiser.", "err");
    GEO_PENDING = analyseGeoCsv(txt);
    paintGeoPreview();
  };

  paintGeoBrowse();
}

function paintGeoPreview() {
  const a = GEO_PENDING;

const METIERS_DEMO_CSV = `Corps de métier;Type d'ouvrage;Libellé;Unité;Nature;Activités;Opérations

let MET_PENDING = null, OUV_PENDING = null;
let METIERS_CACHE = null; // invalidé après import (mode cloud)

function analyseMetiersCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim() !== "");
  if (!lines.length) return { erreurGlobale: "Fichier vide." };
  const head = lines[0];
  const sep = (head.match(/;/g) || []).length >= (head.match(/,/g) || []).length ? ";" : ",";
  const isHeader = /corps.*m[ée]tier/i.test(head);
  const body = isHeader ? lines.slice(1) : lines;

  const rows = [];
  const vusType = new Map();
  const c = { erreur: 0, doublon: 0, avert: 0, ok: 0 };

  body.forEach((raw, i) => {
    const cols = raw.split(sep).map((x) => x.trim());
    const [corpsMetier = "", typeCode = "", typeLibelle = "", unite = "", nature = "", activitesRaw = "", operationsRaw = ""] = cols;
    const activites = activitesRaw.split("|").map((x) => x.trim()).filter(Boolean);
    const operations = operationsRaw.split("|").map((x) => x.trim()).filter(Boolean);
    const problems = [];

    if (!corpsMetier || !typeCode || !nature)
      problems.push({ level: "erreur", msg: "ligne incomplète (corps de métier, type d'ouvrage et nature sont obligatoires)" });
    if (nature && !["quantite", "operations"].includes(nature))
      problems.push({ level: "erreur", msg: "nature inconnue — attendu « quantite » ou « operations »" });
    if (nature === "quantite" && !unite)
      problems.push({ level: "erreur", msg: "unité obligatoire pour un type d'ouvrage quantitatif" });
    if (nature === "operations" && !operations.length)
      problems.push({ level: "erreur", msg: "au moins une opération est requise pour un type d'ouvrage à opérations" });
    if (!activites.length)
      problems.push({ level: "avert", msg: "aucune activité déclarée pour ce type d'ouvrage" });

    let doublon = false;
    const key = corpsMetier + "|" + typeCode;
    if (corpsMetier && typeCode) {
      if (vusType.has(key)) { doublon = true; problems.push({ level: "doublon", msg: "type d'ouvrage déjà présent ligne " + vusType.get(key) }); }
      else vusType.set(key, i + (isHeader ? 2 : 1));
    }

    const bloquant = problems.some((p) => p.level === "erreur") || doublon;
    if (bloquant) { if (doublon) c.doublon++; else c.erreur++; }
    else if (problems.length) c.avert++;
    else c.ok++;

    rows.push({ line: i + (isHeader ? 2 : 1), corpsMetier, typeCode, typeLibelle: typeLibelle || typeCode, unite, nature, activites, operations, problems, bloquant });
  });

  const kept = rows.filter((r) => !r.bloquant);
  const uniq = (arr) => [...new Set(arr)];
  const stats = {
    lignes: rows.length,
    corpsMetier: uniq(kept.map((r) => r.corpsMetier)).length,
    typeOuvrage: kept.length,
    activites: kept.reduce((n, r) => n + r.activites.length, 0),
    operations: kept.reduce((n, r) => n + r.operations.length, 0),
  };
  return { rows, kept, stats, counts: c, sep };
}

function analyseOuvragesCsv(text, typeIndex, localSet) {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.trim() !== "");
  if (!lines.length) return { erreurGlobale: "Fichier vide." };
  const head = lines[0];
  const sep = (head.match(/;/g) || []).length >= (head.match(/,/g) || []).length ? ";" : ",";
  const isHeader = /rep[eè]re/i.test(head);
  const body = isHeader ? lines.slice(1) : lines;

  const rows = [];
  const vus = new Map();
  const c = { erreur: 0, doublon: 0, avert: 0, ok: 0 };

  body.forEach((raw, i) => {
    const cols = raw.split(sep).map((x) => x.trim());
    const [repere = "", corpsMetier = "", typeCode = "", local = "", quantiteRaw = ""] = cols;
    const problems = [];

    if (!repere || !corpsMetier || !typeCode || !local)
      problems.push({ level: "erreur", msg: "ligne incomplète (repère, corps de métier, type d'ouvrage et local sont obligatoires)" });

    const type = typeIndex.get(corpsMetier + "|" + typeCode);
    if (corpsMetier && typeCode && !type)
      problems.push({ level: "erreur", msg: "type d'ouvrage inconnu — importez d'abord la configuration métiers (étape 1)" });
    if (local && !localSet.has(local))
      problems.push({ level: "erreur", msg: "local inconnu du référentiel géographique" });

    const quantitePrevue = quantiteRaw ? Number(quantiteRaw.replace(",", ".")) : null;
    if (type && type.nature === "quantite" && (quantiteRaw === "" || Number.isNaN(quantitePrevue)))
      problems.push({ level: "erreur", msg: "quantité prévue obligatoire pour ce type d'ouvrage" });

    let doublon = false;
    if (repere) {
      if (vus.has(repere)) { doublon = true; problems.push({ level: "doublon", msg: "repère déjà présent ligne " + vus.get(repere) }); }
      else vus.set(repere, i + (isHeader ? 2 : 1));
    }

    const bloquant = problems.some((p) => p.level === "erreur") || doublon;
    if (bloquant) { if (doublon) c.doublon++; else c.erreur++; }
    else if (problems.length) c.avert++;
    else c.ok++;

    rows.push({ line: i + (isHeader ? 2 : 1), repere, corpsMetier, typeCode, typeLibelle: type ? type.libelle : typeCode, unite: type ? type.unite : "", nature: type ? type.nature : "", local, quantitePrevue, problems, bloquant });
  });

  const kept = rows.filter((r) => !r.bloquant);
  const uniq = (arr) => [...new Set(arr)];
  const stats = { lignes: rows.length, ouvrages: kept.length, locaux: uniq(kept.map((r) => r.local)).length, types: uniq(kept.map((r) => r.corpsMetier + "|" + r.typeCode)).length };
  return { rows, kept, stats, counts: c, sep };
}

/* ===== PHASE 4 — saisie d'une déclaration et traçabilité ===== */

let SAISIE_TYPES = [];
let SAISIE_REPERES_INDEX = [];

// Ordre d'affichage des bâtiments dans la saisie (demande terrain, pas
// alphabétique). Un code absent de cette liste se range après, par ordre
// alphabétique.
const ORDRE_BATIMENTS = ["BUA", "BUR", "BASA", "BASB", "BMR", "BAV", "BMN"];
function trierBatiments(codes) {
  return [...codes].sort((a, b) => {
    const ia = ORDRE_BATIMENTS.indexOf(a), ib = ORDRE_BATIMENTS.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}
// Tri vertical des niveaux (+3 en haut, -3 en bas) à partir du suffixe
// signé du code (ex. "UA+2" -> 2, "UA-1" -> -1).
function trierNiveaux(codes) {
  const val = (c) => { const m = String(c).match(/([+-]\d+)\s*$/); return m ? parseInt(m[1], 10) : 0; };
  return [...codes].sort((a, b) => val(b) - val(a));
}
let SAISIE_ROW_SEQ = 0;

function saisieValeurCell(type) {
  if (!type) return `<span class="muted">—</span>`;
  if (type.nature === "quantite") {
    return `<input class="inp sa-quantite" type="number" step="any" placeholder="0" style="width:100px"> <span class="muted" style="font-size:11px">${esc(type.unite)}</span>`;
  }
  return (type.operations || []).map((o) => `<label style="display:block;font-size:12px;font-weight:400"><input type="checkbox" class="sa-op" value="${esc(o.code)}"> ${esc(o.libelle)}</label>`).join("") || `<span class="muted">aucune opération définie</span>`;
}

// RF = liste fermée (référentiel BE) : les options du repère sont limitées
// au type d'ouvrage de la ligne ET au local choisi en en-tête.
function repereOptionsFor(typeCode) {
  const localCode = $("#sa-local").value;
  const metierCode = $("#sa-metier").value;
  if (!localCode || !typeCode) return [];
  return SAISIE_REPERES_INDEX.filter((o) => o.corpsMetier === metierCode && o.typeCode === typeCode && o.local === localCode);
}

function refreshRowRepereOptions(tr) {
  const typeSel = tr.querySelector(".sa-type");
  const repSel = tr.querySelector(".sa-repere");
  const localCode = $("#sa-local").value;
  const opts = repereOptionsFor(typeSel.value);
  const kept = opts.some((o) => o.repere === repSel.value) ? repSel.value : "";
  let placeholder = "— choisir —";
  if (!typeSel.value) placeholder = "— choisir un type d'ouvrage d'abord —";
  else if (!localCode) placeholder = "— choisir un local en en-tête d'abord —";
  else if (!opts.length) placeholder = "aucun ouvrage de ce type sur ce local";
  repSel.innerHTML = `<option value="">${placeholder}</option>` + opts.map((o) => `<option value="${esc(o.repere)}">${esc(o.repere)}</option>`).join("");
  repSel.value = kept;
  repSel.disabled = !opts.length;
}

function addSaisieRow() {
  const tbody = $("#sa-tbody");
  const key = "r" + (SAISIE_ROW_SEQ++);
  const tr = document.createElement("tr");
  tr.dataset.row = key;
  tr.innerHTML = `
    <td><select class="inp sa-type" style="min-width:150px"><option value="">—</option>${SAISIE_TYPES.map((t) => `<option value="${esc(t.code)}">${esc(t.libelle)}</option>`).join("")}</select></td>
    <td><select class="inp sa-repere mono" style="min-width:170px"><option value="">— choisir un type d'abord —</option></select></td>
    <td><select class="inp sa-activite" style="min-width:140px"><option value="">—</option></select></td>
    <td class="sa-valeur">—</td>
    <td><input class="inp sa-commentaire" style="min-width:140px"></td>
    <td><input class="inp sa-bloquants" style="min-width:140px"></td>
    <td style="text-align:center"><input type="checkbox" class="sa-solde"></td>
    <td><button class="btn ghost small sa-del" type="button">✕</button></td>
  `;
  tbody.appendChild(tr);
  const typeSel = tr.querySelector(".sa-type");
  const actSel = tr.querySelector(".sa-activite");
  const valCell = tr.querySelector(".sa-valeur");
  typeSel.onchange = () => {
    const t = SAISIE_TYPES.find((x) => x.code === typeSel.value);
    actSel.innerHTML = `<option value="">—</option>` + (t ? t.activites.map((a) => `<option value="${esc(a.code)}">${esc(a.libelle)}</option>`).join("") : "");
    valCell.innerHTML = saisieValeurCell(t);
    refreshRowRepereOptions(tr);
  };
  tr.querySelector(".sa-del").onclick = () => tr.remove();
  tr.querySelector(".sa-bloquants").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addSaisieRow(); tbody.lastElementChild.querySelector(".sa-type").focus(); }
  });
  refreshRowRepereOptions(tr);
  typeSel.focus();
}

function readSaisieRows() {
  return [...document.querySelectorAll("#sa-tbody tr[data-row]")].map((tr) => {
    const typeCode = tr.querySelector(".sa-type").value;
    const repere = tr.querySelector(".sa-repere").value;
    const activiteCode = tr.querySelector(".sa-activite").value;
    const t = SAISIE_TYPES.find((x) => x.code === typeCode);
    let quantite = null, operationsFaites = [];
    if (t && t.nature === "quantite") {
      const raw = tr.querySelector(".sa-quantite");
      quantite = raw && raw.value !== "" ? Number(raw.value) : null;
    } else if (t) {
      operationsFaites = [...tr.querySelectorAll(".sa-op:checked")].map((c) => c.value);
    }
    return {
      key: tr.dataset.row, typeCode, repere, activiteCode, quantite, operationsFaites,
      commentaire: tr.querySelector(".sa-commentaire").value.trim(),
      pointsBloquants: tr.querySelector(".sa-bloquants").value.trim(),
      solde: tr.querySelector(".sa-solde").checked,
      nature: t ? t.nature : null, unite: t ? t.unite : null,
    };
  });
}

function validateSaisieRows(rows) {
  const errors = [];
  const seen = new Map();
  rows.forEach((r, i) => {
    const msgs = [];
    if (!r.typeCode || !r.repere || !r.activiteCode)
      msgs.push("champ obligatoire manquant (type d'ouvrage, repère ou activité)");

    if (r.nature === "quantite") {
      if (r.quantite == null) { if (!msgs.some((m) => m.includes("obligatoire"))) msgs.push("quantité manquante"); }
      else if (!Number.isFinite(r.quantite) || r.quantite <= 0) msgs.push("quantité aberrante (doit être un nombre positif)");
    }

    const dk = r.repere + "|" + r.activiteCode;
    if (r.repere && r.activiteCode) {
      if (seen.has(dk)) msgs.push("doublon apparent — même repère et même activité que la ligne " + seen.get(dk));
      else seen.set(dk, i + 1);
    }

    if (msgs.length) errors.push({ key: r.key, index: i + 1, msgs });
  });
  return errors;
}

   Écran — Saisie d'une déclaration
